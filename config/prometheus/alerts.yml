groups:
  - name: obox
    rules:
      - alert: ServiceDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "Blackbox HTTP probe for {{ $labels.instance }} has been failing for more than 2 minutes."

      - alert: HighHostMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High host memory usage ({{ $value | printf \"%.1f\" }}%)"
          description: "Host memory utilization has exceeded 85% for more than 5 minutes."

      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High root disk usage ({{ $value | printf \"%.1f\" }}%)"
          description: "Root filesystem usage has exceeded 85% for more than 5 minutes."

      - alert: HighGPUMemory
        expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GPU memory usage on GPU {{ $labels.gpu }} ({{ $value | printf \"%.1f\" }}%)"
          description: "GPU framebuffer memory utilization has exceeded 90% for more than 5 minutes."
