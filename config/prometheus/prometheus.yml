global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics — CPU, memory, disk, network
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Container metrics — per-container CPU, memory, I/O
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # LiteLLM API metrics
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  # HTTP uptime probes for obox services
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://open-webui:8080/health
          - http://litellm:4000/health/liveliness
          - http://ollama:11434/
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # NVIDIA GPU metrics (scraped when dcgm-exporter is running)
  - job_name: nvidia-gpu
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+)
        action: keep
        # Drop target when exporter is not deployed (GPU override off)
        # Prometheus will show the target as down — that's expected without GPU
