name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint shell scripts with ShellCheck
        run: shellcheck scripts/*.sh

      - name: Check bash syntax
        run: bash -n scripts/*.sh

      - name: Validate Docker Compose configs (all 4 modes)
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.gpu.yml config -q

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
